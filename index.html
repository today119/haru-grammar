<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루 문법</title>
<meta name="theme-color" content="#1E3A5F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루 문법">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 한 손 폰 공부용 — 위는 오늘 할 일, 가운데 카드 하나씩, 아래 탭 4개 */
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#16212E; --sub:#5E6B7A; --line:#E2E7EE;
  --brand:#1E3A5F; --brand-soft:#E3ECF6; --ok:#15803D; --ok-soft:#DCFCE7; --no:#C2410C; --no-soft:#FFEDD5;
  --hi:#B45309; --tab-h:calc(62px + env(safe-area-inset-bottom,0px));
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F151C;--card:#18212B;--ink:#E7ECF2;--sub:#9AA7B6;--line:#273241;--brand:#8DB4E0;--brand-soft:#1B2A3B;--ok:#4ADE80;--ok-soft:#12301F;--no:#FB923C;--no-soft:#3A2414;--hi:#FBBF24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F151C;--card:#18212B;--ink:#E7ECF2;--sub:#9AA7B6;--line:#273241;--brand:#8DB4E0;--brand-soft:#1B2A3B;--ok:#4ADE80;--ok-soft:#12301F;--no:#FB923C;--no-soft:#3A2414;--hi:#FBBF24;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6;word-break:keep-all}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(var(--tab-h) + 24px)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:var(--sub)}
.tabs button .e{font-size:21px;line-height:1}
.tabs button.on{color:var(--brand)}
h1{font-size:24px;font-weight:900;letter-spacing:-.03em}
h2{font-size:19px;font-weight:900;margin:22px 2px 10px}
.muted{color:var(--sub);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.stack{display:grid;gap:10px}
.hero{background:var(--brand);color:#fff;border:0;border-radius:20px;padding:18px}
.hero .k{font-size:14px;opacity:.85;font-weight:700}
.hero .t{font-size:21px;font-weight:900;margin-top:4px;letter-spacing:-.02em}
.hero .d{font-size:15px;opacity:.9;margin-top:6px}
.hero .go{margin-top:14px;width:100%;background:#fff;color:#1E3A5F;font-weight:900;font-size:18px;padding:13px;border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--sub);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ok)}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.act .e{font-size:26px}
.act b{display:block;font-size:17px}
.act small{display:block;font-size:14px;color:var(--sub)}
.act .n{margin-left:auto;font-weight:900;font-size:18px;color:var(--no)}
.grp{font-size:14px;font-weight:900;color:var(--sub);margin:18px 4px 6px}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px}
.row .no{flex:0 0 34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-weight:900;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.row .tt{flex:1;min-width:0;font-weight:700;font-size:16px}
.row .st{font-size:13px;font-weight:900;color:var(--sub)}
.row.done .no{background:var(--ok-soft);color:var(--ok)}
.row.today{outline:2px solid var(--hi)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .back{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px}
.top .ti{font-weight:900;font-size:18px;flex:1;min-width:0}
.pt{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:17px}
.pt:last-child{border:0}
.pt i{font-style:normal;color:var(--brand);font-weight:900}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border:0}
.ex .en{font-size:18px;font-weight:700}
.ex .ko{font-size:15px;color:var(--sub)}
.say{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--brand-soft);font-size:18px}
.trap{background:var(--no-soft);color:var(--ink);border:0}
.trap b{color:var(--no)}
.big{width:100%;padding:15px;border-radius:16px;background:var(--brand);color:#fff;font-weight:900;font-size:18px}
.big.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.qh{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:8px}
.qtext{font-size:19px;font-weight:700;line-height:1.55;white-space:pre-wrap}
.ch{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:18px;font-weight:500;margin-top:8px}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--no);background:var(--no-soft)}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ox .ch{text-align:center;font-size:28px;font-weight:900;margin:0}
.fb{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:16px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--no-soft)}
.fb b{display:block;margin-bottom:2px}
.res{text-align:center}
.res .sc{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand)}
.timer{font-variant-numeric:tabular-nums}
.small{font-size:14px;color:var(--sub)}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;font:inherit;font-size:14px}
.w{cursor:pointer;border-bottom:1px dotted var(--sub)}
.w:active{background:var(--brand-soft)}
b.key{color:var(--brand);text-decoration:underline}
#gpop{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + 10px);z-index:50;background:var(--ink);color:var(--bg);border-radius:18px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:600px;margin:0 auto}
#gpop .gw{font-size:22px;font-weight:900}
#gpop .gw .small{color:inherit;opacity:.7;font-size:15px}
#gpop .gk{font-size:19px;font-weight:700;margin-top:2px}
#gpop .small{color:inherit;opacity:.75}
#gpop .gb{display:flex;gap:8px;margin-top:10px}
#gpop .gb button{flex:1;padding:10px;border-radius:12px;background:rgba(255,255,255,.15);font-weight:900}
.rank{width:100%;text-align:left;display:block}.rk{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:17px}.rk:last-of-type{border-bottom:0}.rk.me{background:var(--brand-soft);border-radius:10px}.rk .md{width:30px;font-size:22px;text-align:center}.rk .nm{flex:1;font-weight:900}.rk .sc{text-align:right;font-size:14px}.rk .sc b{font-size:20px}.who{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.who .chip{font-size:16px;padding:8px 12px;border:2px solid transparent;cursor:pointer;opacity:.65}.who .chip.on{opacity:1;border-color:var(--brand);background:var(--brand);color:#fff}
.ox3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}.ox3 .big{padding-left:4px;padding-right:4px}
.drv{text-align:center;padding:26px 14px;min-height:46vh;display:flex;flex-direction:column;justify-content:center;gap:10px}.drv .en1{font-size:44px;font-weight:900;line-height:1.2}.drv .ko1{font-size:28px;font-weight:900;color:var(--ok)}.drv .en2{font-size:22px;font-weight:700;margin-top:8px}.drv .ko2{font-size:17px;color:var(--sub)}.drv .cue{font-size:18px;font-weight:900;color:var(--brand);margin-top:8px;min-height:24px}.act.on{border-color:var(--brand)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.lv .chip{font-size:15px;padding:9px 0;border:2px solid transparent;cursor:pointer;opacity:.6}.lv .chip.on{opacity:1;border-color:var(--brand);background:var(--brand);color:#fff}
.chip{display:inline-block;font-size:12px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs">
  <button data-t="home" class="on"><span class="e">🏠</span>오늘</button>
  <button data-t="list"><span class="e">📚</span>60개 주제</button>
  <button data-t="wrong"><span class="e">📝</span>오답 노트</button>
  <button data-t="mock"><span class="e">🎯</span>모의고사</button>
</nav>
<script>
(function(){
"use strict";
/* ── 자료 ── data/all.json: [{id,title,points[],examples[{en,ko}],trap,quiz[{type,q,choices?,answer,exp}]}] */
var T = [], $app = document.getElementById("app");
/* 연수 일정(미리 알림과 같은 진도표). 날짜 → 그날 들을 차시 */
var PLAN = [["2026-11-04",1,8],["2026-11-05",9,16],["2026-11-06",17,24]];
(function(){
  var days=["09","10","11","12","13","16","17","18","19","20","23","24","25","26","27"], s=25;
  days.forEach(function(d,i){ var n=i<6?3:2; PLAN.push(["2026-11-"+d,s,s+n-1]); s+=n; });
})();
var START="2026-11-04", END="2026-12-15";

/* ── 저장(이 기기 안) ── */
var KEY="haru-grammar.v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
var S = load(); S.done=S.done||{}; S.wrong=S.wrong||{}; S.mocks=S.mocks||[];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/864e5); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function qid(t,i){ return t.id+"-"+i; }
function findQ(id){ var p=id.split("-"), t=T[+p[0]-1]; return t ? {t:t, q:t.quiz[+p[1]], i:+p[1]} : null; }

/* 틀린 문제 복습 간격: 1일 → 3일 → 7일. 두 번 연속 맞히면 졸업 */
var GAP=[1,3,7];
function due(w){ return daysBetween(w.last, today()) >= GAP[Math.min(w.stage||0, GAP.length-1)]; }
function wrongList(){ return Object.keys(S.wrong).filter(function(k){ return !S.wrong[k].grad; }); }
function dueList(){ return wrongList().filter(function(k){ return due(S.wrong[k]); }); }
function mark(id, ok){
  var w=S.wrong[id];
  if(!ok){ S.wrong[id]={last:today(), stage:0, streak:0, miss:(w?w.miss:0)+1, grad:false}; }
  else if(w && !w.grad){ w.streak=(w.streak||0)+1; w.stage=Math.min((w.stage||0)+1,GAP.length-1); w.last=today(); if(w.streak>=2) w.grad=true; }
  save();
}

/* ── 모르는 단어 누르면 뜻 ── 영어 단어마다 누를 수 있는 span 으로 감싼다(한글은 그대로) */
function tw(s){
  return esc(s).replace(/[A-Za-z]+(?:&#39;|'|’)?[a-z]*/g, function(m){
    var k=m.toLowerCase().replace(/’/g,"'");
    if(!G[k] && /'/.test(k)) k=k.split("'")[0];
    return G[k] ? '<span class="w" data-g="'+esc(k)+'">'+m+'</span>' : m;
  });
}
/* 대화처럼 강조할 표현이 있으면 그 부분만 굵게, 나머지는 단어 감싸기 */
function twMark(s, keys){
  var parts=[{t:s,k:false}];
  (keys||[]).forEach(function(key){
    var out=[]; parts.forEach(function(p){ if(p.k){ out.push(p); return; } var seg=p.t.split(key); seg.forEach(function(x,i){ if(x) out.push({t:x,k:false}); if(i<seg.length-1) out.push({t:key,k:true}); }); }); parts=out;
  });
  return parts.map(function(p){ return p.k ? '<b class="key">'+tw(p.t)+'</b>' : tw(p.t); }).join("");
}
var pop=null;
document.addEventListener("click", function(e){
  var w=e.target.closest(".w");
  if(pop && !e.target.closest("#gpop")){ pop.remove(); pop=null; }
  if(!w) return;
  e.stopPropagation(); e.preventDefault();
  var k=w.dataset.g, g=G[k]; if(!g) return;
  pop=document.createElement("div"); pop.id="gpop";
  pop.innerHTML='<div class="gw">'+esc(w.textContent)+(g.b?' <span class="small">← '+esc(g.b)+'</span>':'')+'</div><div class="gk">'+esc(g.ko)+'</div>'+(g.n?'<div class="small">'+esc(g.n)+'</div>':'')+
    '<div class="gb"><button id="gsay">🔊 듣기</button><button id="gx">닫기</button></div>';
  document.body.appendChild(pop);
  document.getElementById("gsay").onclick=function(ev){ ev.stopPropagation(); say(g.b||w.textContent); };
  document.getElementById("gx").onclick=function(ev){ ev.stopPropagation(); pop.remove(); pop=null; };
  say(w.textContent);
}, true);

/* ── 발음 ── */
function say(t){ try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }

/* ── 화면 ── */
var tab="home";
document.getElementById("tabs").onclick=function(e){ var b=e.target.closest("[data-t]"); if(!b) return; go(b.dataset.t); };
function go(t){ if(typeof stopDrive==="function") stopDrive(); tab=t; document.querySelectorAll("#tabs [data-t]").forEach(function(b){ b.className=b.dataset.t===t?"on":""; }); window.scrollTo(0,0); ({home:home,list:list,wrong:wrong,mock:mock})[t](); }

/* 오늘의 영단어·대화 — «날짜»로 정해져서 가족 모두 같은 게 나온다 */
var DAY0="2026-10-04";
function dayIdx(){ return Math.max(0, daysBetween(DAY0, today())); }
/* 가족 모드 = 기초5(연우)+중급5, 고급 도전 해제 기기는 중급5+고급5 를 고를 수 있다 */
function pick5(L){ var list=WL[L]||[]; if(!list.length) return []; var s=(dayIdx()*5)%list.length, a=[]; for(var k=0;k<5;k++){ var ix=(s+k)%list.length, w=Object.assign({},list[ix]); w.lv=L; w.aid=L.charAt(0)+ix; a.push(w); } return a; }
function todayWords(){ return getMode()==="adv" ? pick5("mid").concat(pick5("adv")) : pick5("basic").concat(pick5("mid")); }
function todayDialogTopic(){ var p=todayPlan(); if(p) return p[1]; return (dayIdx()%60)+1; }
function todayDialog(){ var id=todayDialogTopic(); for(var i=0;i<D.length;i++) if(D[i].id===id) return D[i]; return null; }
function todayPlan(){ var d=today(); for(var i=0;i<PLAN.length;i++) if(PLAN[i][0]===d) return PLAN[i]; return null; }
function nextTopic(){ for(var i=0;i<T.length;i++) if(!S.done[T[i].id]) return T[i]; return null; }

function home(){
  var n=Object.keys(S.done).length, d=today(), p=todayPlan(), nx=nextTopic();
  var dl=dueList().length, wl=wrongList().length, acc=accuracy();
  var head;
  if(d<START){ var left=daysBetween(d,START); head='<div class="k">연수 시작까지 D-'+left+' · 미리 예습 중</div><div class="t">'+(nx?nx.id+". "+esc(nx.title):"60개 주제 예습 완료! 🎉")+'</div><div class="d">하루 2~3개씩이면 시작 전에 한 바퀴 돌 수 있어요.</div>'; }
  else if(p){ head='<div class="k">오늘('+d.slice(5).replace("-","/")+') 연수 진도</div><div class="t">'+p[1]+' ~ '+p[2]+'차시</div><div class="d">'+esc(T[p[1]-1]?T[p[1]-1].title:"")+' 부터</div>'; nx=T[p[1]-1]&&!S.done[p[1]]?T[p[1]-1]:nx; }
  else if(d<=END){ head='<div class="k">진도는 끝! 이제 복습과 모의고사</div><div class="t">출석고사 준비 주간</div><div class="d">오답 노트를 비우고 모의고사 90점 이상을 목표로.</div>'; }
  else head='<div class="k">연수 종료</div><div class="t">수고하셨어요 👏</div>';
  $app.innerHTML='<h1>하루 문법</h1><p class="muted">왕초보 영어 탈출 연수 예습·복습 · 2026.11.4 ~ 12.15</p>'+
    '<div class="hero" style="margin-top:14px">'+head+(nx?'<button class="go" id="goNext">'+(S.done[nx.id]?"다시 보기":"공부 시작")+' ▶ '+nx.id+'번</button>':'')+'</div>'+
    '<div class="stats"><div><b>'+n+'</b><span>/60 주제</span></div><div><b>'+(acc==null?"-":acc+"%")+'</b><span>정답률</span></div><div><b>'+wl+'</b><span>남은 오답</span></div></div>'+
    '<div class="bar"><i style="width:'+(n/60*100)+'%"></i></div>'+
    morningCard()+famCard()+
    '<h2>오늘 할 것</h2><div class="stack">'+
    '<button class="act" data-a="drive"><span class="e">🚗</span><span><b>손 안 대고 듣기</b><small>출퇴근 차에서 — 듣고 따라 말하기, 자동으로 계속</small></span></button>'+
    '<button class="act" data-a="review"><span class="e">🔁</span><span><b>복습 문제</b><small>틀렸던 문제 중 다시 풀 때가 된 것</small></span><span class="n">'+dl+'</span></button>'+
    '<button class="act" data-a="wrong"><span class="e">📝</span><span><b>오답 노트</b><small>지금까지 틀린 문제 모아 보기</small></span><span class="n">'+wl+'</span></button>'+
    '<button class="act" data-a="mock"><span class="e">🎯</span><span><b>모의고사 20문항</b><small>'+(S.mocks.length?"최근 "+S.mocks[S.mocks.length-1].score+"점":"전 범위 랜덤, 실전처럼")+'</small></span></button>'+
    '<button class="act" data-a="sync"><span class="e">📲</span><span><b>폰 ↔ 학교 컴 진도 옮기기</b><small>기록은 기기마다 따로 저장돼요</small></span></button>'+
    '</div>';
  var g=document.getElementById("goNext"); if(g) g.onclick=function(){ topic(nx.id); };
  bindMorning(); bindFam();
  $app.querySelectorAll("[data-a]").forEach(function(b){ b.onclick=function(){ var a=b.dataset.a; if(a==="review") review(); else if(a==="sync") sync(); else if(a==="drive") drive(); else go(a); }; });
}
function morningCard(){
  var ws=todayWords(), dg=todayDialog(); if(!ws.length && !dg) return "";
  return '<h2>🌅 아침 영어 <span class="small">'+today().slice(5).replace("-","/")+' · 가족 모두 같은 문제</span></h2><div class="card">'+

function engOnly(s){ var m=String(s).match(/[A-Za-z][A-Za-z ,.'’!?\-_]*[A-Za-z.!?_]/g); return (m||[]).join(" ").replace(/_+/g," blank "); }

function quiz(ids, opt){
  var i=0, ok=0, wrongs=[], t0=Date.now(), tick=null;
  function show(){
    var it=findQ(ids[i]), q=it.q, answered=false;
    var h='<div class="top"><button class="back" id="bk">×</button><div class="ti">'+esc(opt.title)+'</div>'+(opt.timer?'<span class="chip timer" id="tm"></span>':'')+'</div>'+

      '<div class="card"><div class="qtext">'+tw(q.q)+'</div>'+(/[A-Za-z]{2,}/.test(q.q)?'<button class="say" id="qs" style="margin-top:8px;width:auto;padding:0 12px;border-radius:999px">🔊 문장 듣기</button>':'')+'</div>';
    if(q.type==="ox") h+='<div class="ox"><button class="ch" data-c="1">O</button><button class="ch" data-c="0">X</button></div>';
    else h+=shuffle([0,1,2,3]).map(function(k,pos){ return '<button class="ch" data-c="'+k+'">'+String.fromCharCode(9312+pos)+' '+esc(q.choices[k])+'</button>'; }).join("");   /* 보기는 누르면 답이 되어야 해서 단어 풍선을 걸지 않는다 */   // 보기 순서는 매번 섞는다 — 자리로 외우지 않게
    h+='<div id="fb"></div>';
    $app.innerHTML=h; window.scrollTo(0,0);
    document.getElementById("bk").onclick=function(){ clearInterval(tick); go(tab); };
    var qs=document.getElementById("qs"); if(qs) qs.onclick=function(){ say(engOnly(q.q)); };
    $app.querySelectorAll("[data-c]").forEach(function(b){ b.onclick=function(){
      if(answered) return; answered=true;
      var pick=+b.dataset.c, right= q.type==="ox" ? (pick===1)===q.answer : pick===q.answer;
      if(right) ok++; else wrongs.push(ids[i]);
      mark(ids[i], right);
      var good = q.type==="ox" ? (q.answer?"1":"0") : String(q.answer);
      $app.querySelectorAll("[data-c]").forEach(function(x){ if(x.dataset.c===good) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      document.getElementById("fb").innerHTML='<div class="fb '+(right?"ok":"no")+'"><b>'+(right?"정답 ✅":"오답 — 오답 노트에 넣었어요")+'</b>'+esc(q.exp)+'</div>'+
        '<div style="margin-top:12px"><button class="big" id="nq">'+(i+1<ids.length?"다음 문제 ›":"결과 보기")+'</button></div>';
      document.getElementById("nq").onclick=function(){ i++; if(i<ids.length) show(); else done(); };
      document.getElementById("nq").scrollIntoView({block:"nearest"});
    }; });
  }
  function done(){
    clearInterval(tick);
    var score=Math.round(ok/ids.length*100), sec=Math.round((Date.now()-t0)/1000);
    if(opt.topic){ var d=S.done[opt.topic]; if(!d||ok>d.best) S.done[opt.topic]={best:ok,of:ids.length,at:today()}; }
    if(opt.mock){ S.mocks.push({at:today(),score:score,sec:sec}); }
    save();
    $app.innerHTML='<div class="card res"><div class="small">'+esc(opt.title)+'</div><div class="sc">'+(opt.mock?score+"점":ok+" / "+ids.length)+'</div>'+
      '<div class="muted">'+(score>=90?"훌륭해요! 이 실력이면 상위권이에요 🎉":score>=70?"좋아요. 틀린 것만 다시 보면 돼요.":"괜찮아요. 오답 노트로 한 번 더!")+(opt.mock?" · "+Math.floor(sec/60)+"분 "+sec%60+"초":"")+'</div></div>'+
      (wrongs.length?'<h2>틀린 문제</h2><div class="stack">'+wrongs.map(function(id){ var it=findQ(id); return '<div class="card"><div class="small">'+esc(it.t.id+". "+it.t.title)+'</div><div style="font-weight:700;white-space:pre-wrap">'+esc(it.q.q)+'</div><div class="small" style="margin-top:4px">정답: '+esc(it.q.type==="ox"?(it.q.answer?"O":"X"):it.q.choices[it.q.answer])+' — '+esc(it.q.exp)+'</div></div>'; }).join("")+'</div>':'')+
      '<div style="margin-top:16px" class="stack">'+(wrongs.length?'<button class="big" id="again">틀린 것만 다시 풀기</button>':'')+
      (opt.topic&&opt.topic<60?'<button class="big '+(wrongs.length?"ghost":"")+'" id="nt">다음 주제 '+(opt.topic+1)+'번 ›</button>':'')+
      '<button class="big ghost" id="hm">오늘 화면으로</button></div>';
    var a=document.getElementById("again"); if(a) a.onclick=function(){ quiz(shuffle(wrongs), {title:"다시 풀기"}); };
    var nt=document.getElementById("nt"); if(nt) nt.onclick=function(){ topic(opt.topic+1); };
    document.getElementById("hm").onclick=function(){ go("home"); };
  }
  if(opt.timer){ var end=Date.now()+opt.timer*1000; tick=setInterval(function(){ var r=Math.max(0,Math.round((end-Date.now())/1000)), el=document.getElementById("tm"); if(el) el.textContent="⏱ "+Math.floor(r/60)+":"+String(r%60).padStart(2,"0"); if(!r){ clearInterval(tick); } },500); }
  show();
}

  if(advOK()) return '<div class="lv"><button class="chip'+(getMode()==="fam"?" on":"")+'" data-mode="fam">👨‍👩‍👧 기초+중급</button><button class="chip'+(getMode()==="adv"?" on":"")+'" data-mode="adv">🔥 중급+고급</button></div>';
  var left=daysBetween(today(),TEST_DAY);
  return left>0 ? '<div class="small" style="margin-bottom:10px">🔒 🔥 고급 도전 테스트는 D-'+left+'(10/18)에 열려요</div>'
    : '<button class="big ghost" id="advT" style="margin-bottom:12px">🔥 고급 도전 테스트 (10문제 중 8개)</button>';
}
/* 고급 도전 — 지금까지 나온 중급 단어에서 10문제. 8개 이상이면 이 기기에서 고급 해제 */
function advTest(){
  var seen=WL.mid.slice(0, Math.min(WL.mid.length, (dayIdx()+1)*5)); if(seen.length<10) seen=WL.mid.slice(0,40);
  var qs=shuffle(seen.slice()).slice(0,10), i=0, ok=0;
  function draw(){
    if(i>=qs.length){
      var pass=ok>=8; if(pass){ setAdvOK(); setMode("adv"); } if(curP()) famLog("adv", ok);
      $app.innerHTML='<div class="top"><button class="back" id="bk">×</button><div class="ti">🔥 고급 도전 결과</div></div><div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:52px;font-weight:900">'+ok+' / 10</div><div style="font-size:20px;font-weight:900;margin-top:10px">'+(pass?"🎉 합격! "+(curP()?esc(pName(curP()))+"은(는)":"이 기기는")+" 이제 중급+고급":"아쉬워요! 중급을 조금 더 하고 다시 도전")+'</div></div><button class="big" id="hm" style="margin-top:12px">홈으로</button>';
      document.getElementById("bk").onclick=document.getElementById("hm").onclick=function(){ go("home"); }; return;
    }
    var w=qs[i], others=shuffle(WL.mid.filter(function(x){ return x.ko!==w.ko; })).slice(0,3).map(function(x){ return x.ko; }), ch=shuffle([w.ko].concat(others));
    $app.innerHTML='<div class="top"><button class="back" id="bk">×</button><div class="ti">🔥 고급 도전 테스트'+(curP()?' · '+esc(pName(curP())):'')+'</div></div><div class="qh"><span>'+(i+1)+' / 10</span><span>맞힌 개수 '+ok+'</span></div>'+
      '<div class="card" style="text-align:center;padding:26px 12px"><div style="font-size:40px;font-weight:900">'+esc(w.w)+'</div><button class="say" id="sp" style="margin-top:8px">🔊</button></div>'+
      ch.map(function(c,k){ return '<button class="ch" data-k="'+k+'">'+String.fromCharCode(9312+k)+' '+esc(c)+'</button>'; }).join("");
    document.getElementById("bk").onclick=function(){ go("home"); };
    document.getElementById("sp").onclick=function(){ say(w.w); };
    $app.querySelectorAll(".ch").forEach(function(b){ b.onclick=function(){
      var right=ch[+b.dataset.k]===w.ko; if(right) ok++;
      $app.querySelectorAll(".ch").forEach(function(x){ x.disabled=true; if(ch[+x.dataset.k]===w.ko) x.classList.add("right"); });
      if(!right) b.classList.add("wrong");
      setTimeout(function(){ i++; draw(); }, right?600:1400);
    }; });
  }
  draw(); window.scrollTo(0,0);
}
Promise.all([
  fetch("data/all.json",{cache:"no-cache"}).then(function(r){ return r.json(); }),
  fetch("data/words.json",{cache:"no-cache"}).then(function(r){ return r.json(); }).catch(function(){ return []; }),
  fetch("data/dialogues.json",{cache:"no-cache"}).then(function(r){ return r.json(); }).catch(function(){ return []; }),
  fetch("data/gloss.json",{cache:"no-cache"}).then(function(r){ return r.json(); }).catch(function(){ return {}; }),
  fetch("data/words_mid.json",{cache:"no-cache"}).then(function(r){ return r.json(); }).catch(function(){ return []; }),
  fetch("data/words_adv.json",{cache:"no-cache"}).then(function(r){ return r.json(); }).catch(function(){ return []; })
]).then(function(a){ T=a[0]; WL.basic=a[1]; D=a[2]; G=a[3]; WL.mid=a[4]; WL.adv=a[5]; W=WL.basic; go("home"); famLoad().then(function(){ if(FAM && tab==="home" && $app.querySelector("#fam")) home(); }); })
  .catch(function(){ $app.innerHTML='<div class="card">자료를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>'; });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
